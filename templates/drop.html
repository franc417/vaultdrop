<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vaultdrop — claim</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="card">
  <h1>🔓 Claim this drop</h1>
  <div id="metaBox" class="meta">Loading…</div>

  <div id="passRow" style="display:none;">
    <label>Passphrase</label>
    <input type="password" id="passphrase" placeholder="Enter passphrase">
    <button id="claimBtn">Decrypt &amp; Download</button>
  </div>

  <div id="progress" class="progress" style="display:none;"></div>
  <div id="error" class="err" style="display:none;"></div>
  <div id="success" class="meta" style="display:none;"></div>

  <div class="footer-note">
    Decryption happens entirely in your browser. This server never sees the plaintext file or the key.
  </div>
</div>

<script src="/static/vaultdrop.js"></script>
<script>
const token = "{{ token }}";
const metaBox = document.getElementById('metaBox');
const passRow = document.getElementById('passRow');
const claimBtn = document.getElementById('claimBtn');
const progressEl = document.getElementById('progress');
const errorEl = document.getElementById('error');
const successEl = document.getElementById('success');

let meta = null;

// Passphrase embedded in the URL fragment (auto-generated links) never
// leaves the browser — it's not sent in the request line or logged by servers.
const fragmentKey = window.location.hash ? window.location.hash.slice(1) : null;

async function loadMeta() {
  try {
    const res = await fetch(`/api/meta/${token}`);
    const data = await res.json();
    if (!res.ok || !data.alive) {
      metaBox.innerHTML = `This drop is unavailable (${data.reason || 'not found'}).`;
      return;
    }
    meta = data;
    metaBox.innerHTML = `<b>${fmtSize(data.blob_size)}</b> encrypted · ${data.remaining} download(s) remaining · expires ${fmtTs(data.expires_at)}`;

    if (fragmentKey) {
      passRow.style.display = 'none';
      await attemptDecrypt(fragmentKey);
    } else {
      passRow.style.display = 'block';
    }
  } catch (e) {
    metaBox.textContent = 'Failed to load this drop.';
  }
}

async function attemptDecrypt(passphrase) {
  errorEl.style.display = 'none';
  progressEl.style.display = 'block';
  progressEl.textContent = 'Deriving key…';
  claimBtn && (claimBtn.disabled = true);

  try {
    const rawKeyBits = await deriveKeyMaterial(passphrase, fromB64(meta.salt), meta.kdf_iterations);
    const verifier = await computeVerifier(rawKeyBits);

    progressEl.textContent = 'Requesting encrypted blob…';
    const res = await fetch(`/api/download/${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ verifier }),
    });
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data.error === 'Wrong key'
        ? `Wrong passphrase (${data.attempts_remaining} attempt(s) left before this drop self-destructs).`
        : (data.error || 'Failed to claim drop'));
    }

    progressEl.textContent = 'Decrypting locally…';
    const ciphertext = fromB64(data.blob_b64);
    const file = await decryptBlob(ciphertext, meta.salt, meta.nonce, meta.kdf_iterations, passphrase);

    const blob = new Blob([file.bytes], { type: file.type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();

    progressEl.style.display = 'none';
    successEl.style.display = 'block';
    successEl.innerHTML = `✅ Decrypted <b>${file.name}</b> (${fmtSize(file.size)}). Download started.` +
      (data.burned ? ' This drop has now been destroyed.' : '');
    passRow.style.display = 'none';
  } catch (e) {
    progressEl.style.display = 'none';
    errorEl.textContent = e.message;
    errorEl.style.display = 'block';
    claimBtn && (claimBtn.disabled = false);
  }
}

claimBtn.addEventListener('click', () => {
  const p = document.getElementById('passphrase').value;
  if (!p) return;
  attemptDecrypt(p);
});

loadMeta();
</script>
</body>
</html>
